name: Propose upstream rule update
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: rule-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/update_rules.py
      - run: python scripts/build_extensions.py
      - run: python scripts/check_shadowrocket_sources.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/extensions.test.cjs
      - name: Create reviewable update PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="automation/rules-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add --all
          git commit -m 'chore: refresh upstream rule data'
          git push origin "$branch"
          gh pr create --title 'Refresh upstream rule data' --body 'Refresh frozen upstream snapshots and regenerate ordered rule data. Validation passed. Review accounting, compatibility changes and upstream license metadata before merging.'
